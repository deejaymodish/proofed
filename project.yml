name: Proofed
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID, or pick it in Xcode > Signing & Capabilities
targets:
  Proofed:
    type: application
    platform: iOS
    sources: [Proofed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pizzadough.proofed
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Proofed
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ProofedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ProofedTests]
    dependencies:
      - target: Proofed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Proofed:
    build:
      targets:
        Proofed: all
    test:
      targets: [ProofedTests]
